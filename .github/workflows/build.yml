name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The public repository NearestStep/NexusAI runs everything on every push and pull request.
# Any other repository (for example a fork) saves Actions minutes:
# - a push runs nothing, the pull request run covers it;
# - a pull request runs build and unit tests only, and a newer commit cancels the older run;
# - the Paper/Folia smoke matrix runs on workflow_dispatch or on a pull request labeled full-ci
#   (the label is read on the next push to the pull request);
# - the load job runs only on workflow_dispatch; a v* tag runs nothing, because build is
#   skipped on every push.
# The pull_request trigger keeps its default activity types. A labeled type is not added:
# every labeled event would create a run, even with all jobs skipped, and add skipped check
# runs to the public head commit.
permissions:
  contents: read

concurrency:
  group: ${{ github.repository == 'NearestStep/NexusAI' && format('ci-{0}', github.run_id) || format('ci-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.repository != 'NearestStep/NexusAI' }}

jobs:
  build:
    if: github.repository == 'NearestStep/NexusAI' || github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Load-harness self-check
        run: python3 .github/scripts/paper-load.py --self-check
      - name: Smoke-script self-check
        run: python3 .github/scripts/paper-smoke.py --self-check
      # testSnakeYaml26 repeats the unit tests with SnakeYAML 2.6, the version Paper 26.2 ships;
      # test runs them with 2.2 from paper-api 1.20.6.
      - name: Test and build the shaded jar
        run: chmod +x ./gradlew && ./gradlew test testSnakeYaml26 shadowJar loadDriverJar eventsProbeJar --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: NexusAI
          path: build/libs/NexusAI-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: NexusAI-LoadDriver
          path: |
            build/loadtest/NexusAI-LoadDriver.jar
            build/loadtest/nexusai-events-probe.jar
          if-no-files-found: error

  smoke:
    name: Paper ${{ matrix.mc }} (Java ${{ matrix.java }})
    needs: build
    if: github.repository == 'NearestStep/NexusAI' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.20.6"
            java: "21"
          - mc: "1.21.1"
            java: "21"
          - mc: "1.21.4"
            java: "21"
          - mc: "1.21.8"
            java: "21"
          - mc: "26.2"
            java: "25"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NexusAI
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NexusAI-LoadDriver
          path: driver
      - name: Boot stable Paper and run /nai status
        env:
          MC_VERSION: ${{ matrix.mc }}
          PLUGIN_DIR: dist
          DRIVER_DIR: driver
        run: python3 .github/scripts/paper-smoke.py
      - name: Boot stable Paper with startup-banner false
        if: matrix.mc == '26.2'
        env:
          MC_VERSION: ${{ matrix.mc }}
          PLUGIN_DIR: dist
          DRIVER_DIR: driver
          STARTUP_BANNER: "false"
        run: python3 .github/scripts/paper-smoke.py

  folia-smoke:
    name: Folia ${{ matrix.mc }} (Java ${{ matrix.java }})
    needs: build
    if: github.repository == 'NearestStep/NexusAI' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.8"
            java: "21"
          - mc: "1.21.11"
            java: "21"
          - mc: "26.1.2"
            java: "25"
          - mc: "26.2"
            java: "25"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NexusAI
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NexusAI-LoadDriver
          path: driver
      - name: Boot Folia and confirm startup
        env:
          MC_VERSION: ${{ matrix.mc }}
          PLUGIN_DIR: dist
          DRIVER_DIR: driver
        run: python3 .github/scripts/paper-smoke.py --project folia

  load:
    name: Load ${{ matrix.mc }} (Java ${{ matrix.java }})
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.20.6"
            java: "21"
          - mc: "26.2"
            java: "25"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NexusAI
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NexusAI-LoadDriver
          path: driver
      - name: Mode A load scenarios
        env:
          MC_VERSION: ${{ matrix.mc }}
          PLUGIN_DIR: dist
          DRIVER_DIR: driver
        run: python3 .github/scripts/paper-load.py --version "$MC_VERSION" --plugins-dir dist --driver-dir driver --scenario S1,S1-keywords,S2,S2-probe,S3,S6,S-pool --out load-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: load-${{ matrix.mc }}
          path: |
            load-out/report.json
            load-out/mock-requests.jsonl
            load-out/jfr-summary.txt
          if-no-files-found: warn
