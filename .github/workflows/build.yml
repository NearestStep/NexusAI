name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Test and build the shaded jar
        run: chmod +x ./gradlew && ./gradlew test shadowJar --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NexusAI
          path: build/libs/NexusAI-*.jar
          if-no-files-found: error

  smoke:
    name: Paper ${{ matrix.mc }} (Java ${{ matrix.java }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.20.6"
            java: "21"
          - mc: "1.21.1"
            java: "21"
          - mc: "1.21.4"
            java: "21"
          - mc: "1.21.8"
            java: "21"
          - mc: "26.2"
            java: "25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: NexusAI
          path: dist
      - name: Boot stable Paper and run /nai status
        env:
          MC_VERSION: ${{ matrix.mc }}
          PLUGIN_DIR: dist
        run: python3 .github/scripts/paper-smoke.py
