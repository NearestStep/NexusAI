name: NexusAI-LoadDriver
version: '1.2.0-SNAPSHOT'
main: io.github.neareststep.nexusai.load.LoadDriverPlugin
api-version: '1.20.6'
folia-supported: false
depend: [NexusAI, PlaceholderAPI]
authors: [NearestStep]
description: Load scenarios for NexusAI. Not part of the release jar.

commands:
  naiload:
    description: Run one NexusAI load scenario
    usage: "/naiload <scenario> <rate> <seconds> <viewers> | /naiload api <prompt|template> <n> | /naiload events | /naiload json"
    permission: nexusai.load

permissions:
  nexusai.load:
    description: Run NexusAI load scenarios
    default: op
