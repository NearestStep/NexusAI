name: NexusAI
version: '${version}'
main: io.github.neareststep.nexusai.NexusAI
api-version: '1.20.6'
folia-supported: true
authors: [ mo00Wy ]
description: Asynchronous bridge between Minecraft and AI models via PlaceholderAPI
softdepend: [PlaceholderAPI]

commands:
  nai:
    description: NexusAI commands
    usage: /nai <help|version|reload|status|test|prompts|talk>
    aliases: [nexusai]

permissions:
  nexusai.command:
    description: Access /nai admin commands
    default: op
  nexusai.reload:
    description: Reload NexusAI configuration
    default: op
  nexusai.status:
    description: View NexusAI runtime status
    default: op
  nexusai.test:
    description: Send one AI test request
    default: op
  nexusai.talk:
    description: Talk to a character with /nai talk
    default: true
