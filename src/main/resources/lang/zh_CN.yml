# NexusAI messages (Simplified Chinese)
prefix: "&8[&bNexusAI&8]&r "

command:
  no-permission: "{prefix}&c你没有权限。"
  unknown: "{prefix}&c未知子命令。请使用 &e/nai help&c。"
  extra-args: "{prefix}&c多余的参数。请使用 &e/nai help&c。"
  help-header: "{prefix}&eNexusAI 命令："
  help-help: "&7/nai help &8- &f显示此帮助"
  help-version: "&7/nai version &8- &f显示插件版本"
  help-reload: "&7/nai reload &8- &f重载配置、提示词与语言"
  help-status: "&7/nai status &8- &f显示运行状态"
