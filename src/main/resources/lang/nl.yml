# NexusAI messages (Dutch)
prefix: "&8[&bNexusAI&8]&r "

command:
  no-permission: "{prefix}&cGeen toestemming."
  unknown: "{prefix}&cOnbekende subopdracht. Gebruik &e/nai help&c."
  extra-args: "{prefix}&cOnverwachte extra argumenten. Gebruik &e/nai help&c."
  help-header: "{prefix}&eNexusAI-opdrachten:"
  help-help: "&7/nai help &8- &fDeze hulp tonen"
  help-version: "&7/nai version &8- &fPluginversie tonen"
  help-reload: "&7/nai reload &8- &fConfig, prompts en locale herladen"
  help-status: "&7/nai status &8- &fStatus tonen"
  help-test: "&7/nai test [prompt] &8- &fEén testverzoek sturen"
  help-prompts: "&7/nai prompts &8- &fBenoemde prompts tonen"
  help-talk: "&7/nai talk <id> [message] &8- &fTalk to a character. No message opens a session."
  help-talk-end: "&7/nai talk end &8- &fEnd your dialogue session"
  test-sending: "{prefix}&7Testverzoek wordt verzonden..."
  test-ok: "{prefix}&aAntwoord &8({latency_ms} ms)&a: &f{answer}"
  test-fail: "{prefix}&cTest mislukt &8({latency_ms} ms)&c: &f{error}"
  version: "{prefix}&fVersie: &a{version}"
  prompts-header: "{prefix}&eBenoemde prompts &8({count})&e:"
  prompts-line: "&7- &f{id}"
  prompts-empty: "{prefix}&7Geen benoemde prompts. Zet ze in &fprompts.yml&7."
  reload-ok: "{prefix}&aConfiguratie herladen."
  reload-fail: "{prefix}&cHerladen mislukt: &f{error}"
  status-header: "{prefix}&eStatus:"
  status-locale: "&7Locale: &f{locale}"
  status-provider: "&7Provider: &f{provider}"
  status-base-url: "&7Base-URL: &f{base_url}"
  status-model: "&7Model: &f{model}"
  status-api-key: "&7API-sleutel: &f{api_key}"
  status-pool: "&7Pool: &f{pool_state} &8({pool_entries} items)"
  status-cache: "&7Cachegrootte: &f{cache_size}"
  status-prompts: "&7Benoemde prompts: &f{prompts}"
  status-papi: "&7PlaceholderAPI: &f{papi}"
  status-last-error: "&7Laatste fout: &f{last_error}"
  status-provider-pause: "&7Providerpauze: &f{provider_pause}"

common:
  "yes": "ja"
  "no": "nee"
  enabled: "ingeschakeld"
  disabled: "uitgeschakeld"
  none: "geen"

error:
  rate-limit: "snelheidslimiet"
  quota: "quotum"
  bad-key: "ongeldige API-sleutel"
  unknown-model: "onbekend model"
  timeout: "time-out"
  other: "fout"

# Dialogue keys below are English until translated.
talk:
  disabled: "{prefix}&cDialogues are disabled."
  players-only: "{prefix}&cOnly players can talk to a character. From the console: &e/nai talk <player> <id>"
  usage: "{prefix}&cUsage: &e/nai talk <id> [message] &cor &e/nai talk end"
  unknown-character: "{prefix}&cUnknown character &f{id}&c."
  unknown-player: "{prefix}&cPlayer &f{player} &cis not online."
  no-session: "{prefix}&7You are not in a dialogue."
  ended: "{prefix}&7Dialogue ended."
  started: "{prefix}&7You are talking to &f{id}&7. Type in chat. &e/nai talk end &7stops it."
  timeout: "{prefix}&7The conversation ended."
  left: "{prefix}&7You walked away."
  cooldown: "{prefix}&7Wait a moment."
  too-long: "{prefix}&cThat message is too long. Max &f{max}&c characters."
  replies: "{prefix}&7This conversation is over."
  daily: "{prefix}&cYou have reached today's conversation limit."
  busy: "{prefix}&7The character is busy. Try again later."
  failed: "{prefix}&cNo reply: &f{error}"
  empty: "{prefix}&7Say a little more."
  reply: "{prefix}&f{character}&7: &f{reply}"
