# NexusAI messages (Spanish)
prefix: "&8[&bNexusAI&8]&r "

command:
  no-permission: "{prefix}&cNo tienes permiso."
  unknown: "{prefix}&cSubcomando desconocido. Usa &e/nai help&c."
  extra-args: "{prefix}&cArgumentos de más. Use &e/nai help&c."
  help-header: "{prefix}&eComandos de NexusAI:"
  help-help: "&7/nai help &8- &fMostrar esta ayuda"
  help-version: "&7/nai version &8- &fMostrar la versión del plugin"
  help-reload: "&7/nai reload &8- &fRecargar config, prompts y locale"
  help-status: "&7/nai status &8- &fMostrar el estado"
  help-test: "&7/nai test [prompt] &8- &fEnviar una solicitud de prueba"
  help-prompts: "&7/nai prompts &8- &fListar prompts con nombre"
  help-talk: "&7/nai talk <id> [message] &8- &fTalk to a character. No message opens a session."
  help-talk-end: "&7/nai talk end &8- &fEnd your dialogue session"
  test-sending: "{prefix}&7Enviando una solicitud de prueba..."
  test-ok: "{prefix}&aRespuesta &8({latency_ms} ms)&a: &f{answer}"
  test-fail: "{prefix}&cPrueba fallida &8({latency_ms} ms)&c: &f{error}"
  version: "{prefix}&fVersión: &a{version}"
  prompts-header: "{prefix}&ePrompts con nombre &8({count})&e:"
  prompts-line: "&7- &f{id}"
  prompts-empty: "{prefix}&7No hay prompts con nombre. Añádelos en &fprompts.yml&7."
  reload-ok: "{prefix}&aConfiguración recargada."
  reload-fail: "{prefix}&cError al recargar: &f{error}"
  status-header: "{prefix}&eEstado:"
  status-locale: "&7Locale: &f{locale}"
  status-provider: "&7Proveedor: &f{provider}"
  status-base-url: "&7Base URL: &f{base_url}"
  status-model: "&7Modelo: &f{model}"
  status-api-key: "&7Clave API: &f{api_key}"
  status-pool: "&7Pool: &f{pool_state} &8({pool_entries} entradas)"
  status-cache: "&7Tamaño de caché: &f{cache_size}"
  status-prompts: "&7Prompts con nombre: &f{prompts}"
  status-papi: "&7PlaceholderAPI: &f{papi}"
  status-last-error: "&7Último error: &f{last_error}"
  status-provider-pause: "&7Pausa del proveedor: &f{provider_pause}"

common:
  "yes": "sí"
  "no": "no"
  enabled: "activado"
  disabled: "desactivado"
  none: "ninguno"

error:
  rate-limit: "límite de solicitudes"
  quota: "cuota"
  bad-key: "clave API inválida"
  unknown-model: "modelo desconocido"
  timeout: "tiempo de espera"
  other: "error"

# Dialogue keys below are English until translated.
talk:
  disabled: "{prefix}&cDialogues are disabled."
  players-only: "{prefix}&cOnly players can talk to a character. From the console: &e/nai talk <player> <id>"
  usage: "{prefix}&cUsage: &e/nai talk <id> [message] &cor &e/nai talk end"
  unknown-character: "{prefix}&cUnknown character &f{id}&c."
  unknown-player: "{prefix}&cPlayer &f{player} &cis not online."
  no-session: "{prefix}&7You are not in a dialogue."
  ended: "{prefix}&7Dialogue ended."
  started: "{prefix}&7You are talking to &f{id}&7. Type in chat. &e/nai talk end &7stops it."
  timeout: "{prefix}&7The conversation ended."
  left: "{prefix}&7You walked away."
  cooldown: "{prefix}&7Wait a moment."
  too-long: "{prefix}&cThat message is too long. Max &f{max}&c characters."
  replies: "{prefix}&7This conversation is over."
  daily: "{prefix}&cYou have reached today's conversation limit."
  busy: "{prefix}&7The character is busy. Try again later."
  failed: "{prefix}&cNo reply: &f{error}"
  empty: "{prefix}&7Say a little more."
  reply: "{prefix}&f{character}&7: &f{reply}"
