# NexusAI messages (Polish)
prefix: "&8[&bNexusAI&8]&r "

command:
  no-permission: "{prefix}&cBrak uprawnień."
  unknown: "{prefix}&cNieznana podkomenda. Użyj &e/nai help&c."
  extra-args: "{prefix}&cZbędne argumenty. Użyj &e/nai help&c."
  help-header: "{prefix}&eKomendy NexusAI:"
  help-help: "&7/nai help &8- &fPokaż tę pomoc"
  help-version: "&7/nai version &8- &fPokaż wersję wtyczki"
  help-reload: "&7/nai reload &8- &fPrzeładuj config, prompty i locale"
  help-status: "&7/nai status &8- &fPokaż status"
  help-test: "&7/nai test [prompt] &8- &fWyślij jedno żądanie testowe"
  help-prompts: "&7/nai prompts &8- &fWypisz nazwane prompty"
  help-talk: "&7/nai talk <id> [message] &8- &fTalk to a character. No message opens a session."
  help-talk-end: "&7/nai talk end &8- &fEnd your dialogue session"
  test-sending: "{prefix}&7Wysyłanie żądania testowego..."
  test-ok: "{prefix}&aOdpowiedź &8({latency_ms} ms)&a: &f{answer}"
  test-fail: "{prefix}&cTest nieudany &8({latency_ms} ms)&c: &f{error}"
  version: "{prefix}&fWersja: &a{version}"
  prompts-header: "{prefix}&eNazwane prompty &8({count})&e:"
  prompts-line: "&7- &f{id}"
  prompts-empty: "{prefix}&7Brak nazwanych promptów. Dodaj je w &fprompts.yml&7."
  reload-ok: "{prefix}&aKonfiguracja przeładowana."
  reload-fail: "{prefix}&cBłąd przeładowania: &f{error}"
  status-header: "{prefix}&eStatus:"
  status-locale: "&7Locale: &f{locale}"
  status-provider: "&7Dostawca: &f{provider}"
  status-base-url: "&7Base URL: &f{base_url}"
  status-model: "&7Model: &f{model}"
  status-api-key: "&7Klucz API: &f{api_key}"
  status-pool: "&7Pula: &f{pool_state} &8({pool_entries} wpisów)"
  status-cache: "&7Rozmiar cache: &f{cache_size}"
  status-prompts: "&7Nazwane prompty: &f{prompts}"
  status-papi: "&7PlaceholderAPI: &f{papi}"
  status-last-error: "&7Ostatni błąd: &f{last_error}"
  status-provider-pause: "&7Pauza dostawcy: &f{provider_pause}"

common:
  "yes": "tak"
  "no": "nie"
  enabled: "włączone"
  disabled: "wyłączone"
  none: "brak"

error:
  rate-limit: "limit zapytań"
  quota: "limit środków"
  bad-key: "zły klucz API"
  unknown-model: "nieznany model"
  timeout: "limit czasu"
  other: "błąd"

# Dialogue keys below are English until translated.
talk:
  disabled: "{prefix}&cDialogues are disabled."
  players-only: "{prefix}&cOnly players can talk to a character. From the console: &e/nai talk <player> <id>"
  usage: "{prefix}&cUsage: &e/nai talk <id> [message] &cor &e/nai talk end"
  unknown-character: "{prefix}&cUnknown character &f{id}&c."
  unknown-player: "{prefix}&cPlayer &f{player} &cis not online."
  no-session: "{prefix}&7You are not in a dialogue."
  ended: "{prefix}&7Dialogue ended."
  started: "{prefix}&7You are talking to &f{id}&7. Type in chat. &e/nai talk end &7stops it."
  timeout: "{prefix}&7The conversation ended."
  left: "{prefix}&7You walked away."
  cooldown: "{prefix}&7Wait a moment."
  too-long: "{prefix}&cThat message is too long. Max &f{max}&c characters."
  replies: "{prefix}&7This conversation is over."
  daily: "{prefix}&cYou have reached today's conversation limit."
  busy: "{prefix}&7The character is busy. Try again later."
  failed: "{prefix}&cNo reply: &f{error}"
  empty: "{prefix}&7Say a little more."
  reply: "{prefix}&f{character}&7: &f{reply}"
