# NexusAI messages (Brazilian Portuguese)
prefix: "&8[&bNexusAI&8]&r "

command:
  no-permission: "{prefix}&cSem permissão."
  unknown: "{prefix}&cSubcomando desconhecido. Use &e/nai help&c."
  extra-args: "{prefix}&cArgumentos a mais. Use &e/nai help&c."
  help-header: "{prefix}&eComandos do NexusAI:"
  help-help: "&7/nai help &8- &fMostrar esta ajuda"
  help-version: "&7/nai version &8- &fMostrar a versão do plugin"
  help-reload: "&7/nai reload &8- &fRecarregar config, prompts e locale"
  help-status: "&7/nai status &8- &fMostrar o status"
  help-test: "&7/nai test [prompt] &8- &fEnviar uma requisição de teste"
  help-prompts: "&7/nai prompts &8- &fListar prompts nomeados"
  help-talk: "&7/nai talk <id> [message] &8- &fTalk to a character. No message opens a session."
  help-talk-end: "&7/nai talk end &8- &fEnd your dialogue session"
  test-sending: "{prefix}&7Enviando uma requisição de teste..."
  test-ok: "{prefix}&aResposta &8({latency_ms} ms)&a: &f{answer}"
  test-fail: "{prefix}&cTeste falhou &8({latency_ms} ms)&c: &f{error}"
  version: "{prefix}&fVersão: &a{version}"
  prompts-header: "{prefix}&ePrompts nomeados &8({count})&e:"
  prompts-line: "&7- &f{id}"
  prompts-empty: "{prefix}&7Nenhum prompt nomeado. Adicione-os em &fprompts.yml&7."
  reload-ok: "{prefix}&aConfiguração recarregada."
  reload-fail: "{prefix}&cFalha ao recarregar: &f{error}"
  status-header: "{prefix}&eStatus:"
  status-locale: "&7Locale: &f{locale}"
  status-provider: "&7Provedor: &f{provider}"
  status-base-url: "&7Base URL: &f{base_url}"
  status-model: "&7Modelo: &f{model}"
  status-api-key: "&7Chave API: &f{api_key}"
  status-pool: "&7Pool: &f{pool_state} &8({pool_entries} entradas)"
  status-cache: "&7Tamanho do cache: &f{cache_size}"
  status-prompts: "&7Prompts nomeados: &f{prompts}"
  status-papi: "&7PlaceholderAPI: &f{papi}"
  status-last-error: "&7Último erro: &f{last_error}"
  status-provider-pause: "&7Pausa do provedor: &f{provider_pause}"

common:
  "yes": "sim"
  "no": "não"
  enabled: "ativado"
  disabled: "desativado"
  none: "nenhum"

error:
  rate-limit: "limite de requisições"
  quota: "cota"
  bad-key: "chave API inválida"
  unknown-model: "modelo desconhecido"
  timeout: "tempo esgotado"
  other: "erro"

# Dialogue keys below are English until translated.
talk:
  disabled: "{prefix}&cDialogues are disabled."
  players-only: "{prefix}&cOnly players can talk to a character. From the console: &e/nai talk <player> <id>"
  usage: "{prefix}&cUsage: &e/nai talk <id> [message] &cor &e/nai talk end"
  unknown-character: "{prefix}&cUnknown character &f{id}&c."
  unknown-player: "{prefix}&cPlayer &f{player} &cis not online."
  no-session: "{prefix}&7You are not in a dialogue."
  ended: "{prefix}&7Dialogue ended."
  started: "{prefix}&7You are talking to &f{id}&7. Type in chat. &e/nai talk end &7stops it."
  timeout: "{prefix}&7The conversation ended."
  left: "{prefix}&7You walked away."
  cooldown: "{prefix}&7Wait a moment."
  too-long: "{prefix}&cThat message is too long. Max &f{max}&c characters."
  replies: "{prefix}&7This conversation is over."
  daily: "{prefix}&cYou have reached today's conversation limit."
  busy: "{prefix}&7The character is busy. Try again later."
  failed: "{prefix}&cNo reply: &f{error}"
  empty: "{prefix}&7Say a little more."
  reply: "{prefix}&f{character}&7: &f{reply}"
