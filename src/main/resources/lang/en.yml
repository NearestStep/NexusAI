# NexusAI messages (English — canonical)
prefix: "&8[&bNexusAI&8]&r "

command:
  no-permission: "{prefix}&cYou do not have permission."
  unknown: "{prefix}&cUnknown subcommand. Use &e/nai help&c."
  extra-args: "{prefix}&cUnexpected extra arguments. Use &e/nai help&c."
  help-header: "{prefix}&eNexusAI commands:"
  help-help: "&7/nai help &8- &fShow this help"
  help-version: "&7/nai version &8- &fShow plugin version and author"
  help-reload: "&7/nai reload &8- &fReload config, prompts, knowledge, and lang files"
  help-status: "&7/nai status &8- &fShow runtime status"
  help-test: "&7/nai test [prompt] &8- &fSend one test request"
  help-prompts: "&7/nai prompts &8- &fList named prompts"
  help-prompts-import: "&7/nai prompts import <file> [--overwrite] &8- &fImport prompts from the import folder"
  prompts-import-ok: "{prefix}&aImported &f{file}&a. Added: &f{added}&a. Skipped: &f{skipped}&a. Conflicting: &f{conflicting}&a."
  prompts-import-fail: "{prefix}&cImport failed: &f{error}"
  status-fallback-model: "&7Fallback model: &f{entry}"
  status-knowledge: "&7Knowledge files: &f{files}"
  status-unpooled: "&7generate_ requested but not pooled: &f{prompts}"
  test-sending: "{prefix}&7Sending a test request..."
  test-ok: "{prefix}&aAnswer &8({latency_ms} ms)&a: &f{answer}"
  test-fail: "{prefix}&cTest failed &8({latency_ms} ms)&c: &f{error}"
  version: "{prefix}&fVersion: &a{version}&7. Author: &f{authors}"
  prompts-header: "{prefix}&eNamed prompts &8({count})&e:"
  prompts-line: "&7- &f{id}"
  prompts-empty: "{prefix}&7No named prompts are defined. Add them in &fprompts.yml&7."
  reload-ok: "{prefix}&aConfiguration reloaded."
  reload-fail: "{prefix}&cReload failed: &f{error}"
  status-header: "{prefix}&eStatus:"
  status-locale: "&7Locale: &f{locale}"
  status-provider: "&7Provider: &f{provider}"
  status-base-url: "&7Base URL: &f{base_url}"
  status-model: "&7Model: &f{model}"
  status-api-key: "&7API key: &f{api_key}"
  status-pool: "&7Pool: &f{pool_state} &8({pool_entries} entries)"
  status-cache: "&7Cache size: &f{cache_size}"
  status-prompts: "&7Named prompts: &f{prompts}"
  status-papi: "&7PlaceholderAPI: &f{papi}"
  status-last-error: "&7Last error: &f{last_error}"
  status-provider-pause: "&7Provider pause: &f{provider_pause}"
  status-queue-header: "&7Model queue:"
  status-queue-line: "&7- &f{entry}"

common:
  "yes": "yes"
  "no": "no"
  enabled: "enabled"
  disabled: "disabled"
  none: "none"

error:
  rate-limit: "rate limit"
  quota: "quota"
  bad-key: "bad API key"
  unknown-model: "unknown model"
  timeout: "timeout"
  other: "error"
