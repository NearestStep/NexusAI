# NexusAI messages (French)
prefix: "&8[&bNexusAI&8]&r "

command:
  no-permission: "{prefix}&cPermission refusée."
  unknown: "{prefix}&cSous-commande inconnue. Utilisez &e/nai help&c."
  extra-args: "{prefix}&cArguments en trop. Utilisez &e/nai help&c."
  help-header: "{prefix}&eCommandes NexusAI :"
  help-help: "&7/nai help &8- &fAfficher cette aide"
  help-version: "&7/nai version &8- &fAfficher la version du plugin"
  help-reload: "&7/nai reload &8- &fRecharger la config, les prompts et la locale"
  help-status: "&7/nai status &8- &fAfficher l'état"
  help-test: "&7/nai test [prompt] &8- &fEnvoyer une requête de test"
  help-prompts: "&7/nai prompts &8- &fLister les prompts nommés"
  help-talk: "&7/nai talk <id> [message] &8- &fTalk to a character. No message opens a session."
  help-talk-end: "&7/nai talk end &8- &fEnd your dialogue session"
  test-sending: "{prefix}&7Envoi d'une requête de test..."
  test-ok: "{prefix}&aRéponse &8({latency_ms} ms)&a : &f{answer}"
  test-fail: "{prefix}&cTest échoué &8({latency_ms} ms)&c : &f{error}"
  version: "{prefix}&fVersion : &a{version}"
  prompts-header: "{prefix}&ePrompts nommés &8({count})&e :"
  prompts-line: "&7- &f{id}"
  prompts-empty: "{prefix}&7Aucun prompt nommé. Ajoutez-les dans &fprompts.yml&7."
  reload-ok: "{prefix}&aConfiguration rechargée."
  reload-fail: "{prefix}&cÉchec du rechargement : &f{error}"
  status-header: "{prefix}&eÉtat :"
  status-locale: "&7Locale : &f{locale}"
  status-provider: "&7Fournisseur : &f{provider}"
  status-base-url: "&7Base URL : &f{base_url}"
  status-model: "&7Modèle : &f{model}"
  status-api-key: "&7Clé API : &f{api_key}"
  status-pool: "&7Pool : &f{pool_state} &8({pool_entries} entrées)"
  status-cache: "&7Taille du cache : &f{cache_size}"
  status-prompts: "&7Prompts nommés : &f{prompts}"
  status-papi: "&7PlaceholderAPI : &f{papi}"
  status-last-error: "&7Dernière erreur : &f{last_error}"
  status-provider-pause: "&7Pause du fournisseur : &f{provider_pause}"

common:
  "yes": "oui"
  "no": "non"
  enabled: "activé"
  disabled: "désactivé"
  none: "aucune"

error:
  rate-limit: "limite de débit"
  quota: "quota"
  bad-key: "clé API invalide"
  unknown-model: "modèle inconnu"
  timeout: "délai dépassé"
  other: "erreur"

# Dialogue keys below are English until translated.
talk:
  disabled: "{prefix}&cDialogues are disabled."
  players-only: "{prefix}&cOnly players can talk to a character. From the console: &e/nai talk <player> <id>"
  usage: "{prefix}&cUsage: &e/nai talk <id> [message] &cor &e/nai talk end"
  unknown-character: "{prefix}&cUnknown character &f{id}&c."
  unknown-player: "{prefix}&cPlayer &f{player} &cis not online."
  no-session: "{prefix}&7You are not in a dialogue."
  ended: "{prefix}&7Dialogue ended."
  started: "{prefix}&7You are talking to &f{id}&7. Type in chat. &e/nai talk end &7stops it."
  timeout: "{prefix}&7The conversation ended."
  left: "{prefix}&7You walked away."
  cooldown: "{prefix}&7Wait a moment."
  too-long: "{prefix}&cThat message is too long. Max &f{max}&c characters."
  replies: "{prefix}&7This conversation is over."
  daily: "{prefix}&cYou have reached today's conversation limit."
  busy: "{prefix}&7The character is busy. Try again later."
  failed: "{prefix}&cNo reply: &f{error}"
  empty: "{prefix}&7Say a little more."
  reply: "{prefix}&f{character}&7: &f{reply}"
