  usage: "{prefix}&cUtilisation : &e/nai talk <id> [message] &cou &e/nai talk end"
  unknown-character: "{prefix}&cPersonnage inconnu &f{id}&c."
  unknown-player: "{prefix}&cLe joueur &f{player} &cn'est pas en ligne."
  no-session: "{prefix}&7Vous n'êtes pas dans un dialogue."
  ended: "{prefix}&7Dialogue terminé."
  started: "{prefix}&7Vous parlez à &f{id}&7. Écrivez dans le chat. &e/nai talk end &7l'arrête."
  timeout: "{prefix}&7La conversation est terminée."
  left: "{prefix}&7Vous vous êtes éloigné."
  cooldown: "{prefix}&7Patientez un instant."
  too-long: "{prefix}&cCe message est trop long. Maximum &f{max}&c caractères."
  replies: "{prefix}&7Cette conversation est terminée."
  daily: "{prefix}&cVous avez atteint la limite de conversations du jour."
  busy: "{prefix}&7Le personnage est occupé. Réessayez plus tard."
  failed: "{prefix}&cPas de réponse : &f{error}"
  empty: "{prefix}&7Dites-en un peu plus."
  reply: "{prefix}&f{character}&7 : &f{reply}"
