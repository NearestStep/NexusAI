  prompts-empty: "{prefix}&7Žádné pojmenované prompty. Přidejte je do &fprompts.yml&7."
  reload-ok: "{prefix}&aKonfigurace znovu načtena."
  reload-fail: "{prefix}&cObnovení selhalo: &f{error}"
  status-header: "{prefix}&eStav:"
  status-locale: "&7Locale: &f{locale}"
  status-provider: "&7Poskytovatel: &f{provider}"
  status-base-url: "&7Base URL: &f{base_url}"
  status-model: "&7Model: &f{model}"
  status-api-key: "&7API klíč: &f{api_key}"
  status-pool: "&7Pool: &f{pool_state} &8({pool_entries} záznamů)"
  status-cache: "&7Velikost cache: &f{cache_size}"
  status-prompts: "&7Pojmenované prompty: &f{prompts}"
  status-papi: "&7PlaceholderAPI: &f{papi}"
  status-last-error: "&7Poslední chyba: &f{last_error}"
  status-provider-pause: "&7Pauza poskytovatele: &f{provider_pause}"

  help-prompts-import: "&7/nai prompts import <file> [--overwrite] &8- &fImportovat prompty ze složky import"
  prompts-import-ok: "{prefix}&aImportováno &f{file}&a. Přidáno: &f{added}&a. Přeskočeno: &f{skipped}&a. Konflikty: &f{conflicting}&a."
  prompts-import-fail: "{prefix}&cImport selhal: &f{error}"
  status-fallback-model: "&7Záložní model: &f{entry}"
  status-knowledge: "&7Soubory znalostí: &f{files}"
  status-unpooled: "&7generate_ požadován, ale není v poolu: &f{prompts}"

common:
  "yes": "ano"
  "no": "ne"
  enabled: "zapnuto"
  disabled: "vypnuto"
  none: "žádná"

error:
  rate-limit: "limit požadavků"
  quota: "kvóta"
  bad-key: "neplatný API klíč"
  unknown-model: "neznámý model"
  timeout: "časový limit"
  other: "chyba"

talk:
  disabled: "{prefix}&cDialogy jsou vypnuté."
  players-only: "{prefix}&cS postavou mohou mluvit jen hráči. Z konzole: &e/nai talk <player> <id>"
  usage: "{prefix}&cPoužití: &e/nai talk <id> [message] &cnebo &e/nai talk end"
  unknown-character: "{prefix}&cNeznámá postava &f{id}&c."
  unknown-player: "{prefix}&cHráč &f{player} &cnení online."
  no-session: "{prefix}&7Nejste v dialogu."
  ended: "{prefix}&7Dialog ukončen."
  started: "{prefix}&7Mluvíte s &f{id}&7. Pište do chatu. &e/nai talk end &7ho ukončí."
  timeout: "{prefix}&7Rozhovor skončil."
  left: "{prefix}&7Odešli jste příliš daleko."
  cooldown: "{prefix}&7Chvíli počkejte."
  too-long: "{prefix}&cTa zpráva je příliš dlouhá. Maximum &f{max}&c znaků."
  replies: "{prefix}&7Tento rozhovor skončil."
  daily: "{prefix}&cDosáhli jste dnešního limitu rozhovorů."
  busy: "{prefix}&7Postava je zaneprázdněná. Zkuste to později."
  failed: "{prefix}&cŽádná odpověď: &f{error}"
  empty: "{prefix}&7Napište o něco víc."
  reply: "{prefix}&f{character}&7: &f{reply}"
