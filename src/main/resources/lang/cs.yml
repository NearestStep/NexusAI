# NexusAI messages (Czech)
prefix: "&8[&bNexusAI&8]&r "

command:
  no-permission: "{prefix}&cNemáte oprávnění."
  unknown: "{prefix}&cNeznámý podpříkaz. Použijte &e/nai help&c."
  extra-args: "{prefix}&cPřebytečné argumenty. Použijte &e/nai help&c."
  help-header: "{prefix}&ePříkazy NexusAI:"
  help-help: "&7/nai help &8- &fZobrazit tuto nápovědu"
  help-version: "&7/nai version &8- &fZobrazit verzi pluginu"
  help-reload: "&7/nai reload &8- &fZnovu načíst config, prompty a locale"
  help-status: "&7/nai status &8- &fZobrazit stav"
  help-test: "&7/nai test [prompt] &8- &fOdeslat jeden testovací požadavek"
  help-prompts: "&7/nai prompts &8- &fVypsat pojmenované prompty"
  help-talk: "&7/nai talk <id> [message] &8- &fTalk to a character. No message opens a session."
  help-talk-end: "&7/nai talk end &8- &fEnd your dialogue session"
  test-sending: "{prefix}&7Odesílání testovacího požadavku..."
  test-ok: "{prefix}&aOdpověď &8({latency_ms} ms)&a: &f{answer}"
  test-fail: "{prefix}&cTest selhal &8({latency_ms} ms)&c: &f{error}"
  version: "{prefix}&fVerze: &a{version}"
  prompts-header: "{prefix}&ePojmenované prompty &8({count})&e:"
  prompts-line: "&7- &f{id}"
  prompts-empty: "{prefix}&7Žádné pojmenované prompty. Přidejte je do &fprompts.yml&7."
  reload-ok: "{prefix}&aKonfigurace znovu načtena."
  reload-fail: "{prefix}&cObnovení selhalo: &f{error}"
  status-header: "{prefix}&eStav:"
  status-locale: "&7Locale: &f{locale}"
  status-provider: "&7Poskytovatel: &f{provider}"
  status-base-url: "&7Base URL: &f{base_url}"
  status-model: "&7Model: &f{model}"
  status-api-key: "&7API klíč: &f{api_key}"
  status-pool: "&7Pool: &f{pool_state} &8({pool_entries} záznamů)"
  status-cache: "&7Velikost cache: &f{cache_size}"
  status-prompts: "&7Pojmenované prompty: &f{prompts}"
  status-papi: "&7PlaceholderAPI: &f{papi}"
  status-last-error: "&7Poslední chyba: &f{last_error}"
  status-provider-pause: "&7Pauza poskytovatele: &f{provider_pause}"

common:
  "yes": "ano"
  "no": "ne"
  enabled: "zapnuto"
  disabled: "vypnuto"
  none: "žádná"

error:
  rate-limit: "limit požadavků"
  quota: "kvóta"
  bad-key: "neplatný API klíč"
  unknown-model: "neznámý model"
  timeout: "časový limit"
  other: "chyba"

# Dialogue keys below are English until translated.
talk:
  disabled: "{prefix}&cDialogues are disabled."
  players-only: "{prefix}&cOnly players can talk to a character. From the console: &e/nai talk <player> <id>"
  usage: "{prefix}&cUsage: &e/nai talk <id> [message] &cor &e/nai talk end"
  unknown-character: "{prefix}&cUnknown character &f{id}&c."
  unknown-player: "{prefix}&cPlayer &f{player} &cis not online."
  no-session: "{prefix}&7You are not in a dialogue."
  ended: "{prefix}&7Dialogue ended."
  started: "{prefix}&7You are talking to &f{id}&7. Type in chat. &e/nai talk end &7stops it."
  timeout: "{prefix}&7The conversation ended."
  left: "{prefix}&7You walked away."
  cooldown: "{prefix}&7Wait a moment."
  too-long: "{prefix}&cThat message is too long. Max &f{max}&c characters."
  replies: "{prefix}&7This conversation is over."
  daily: "{prefix}&cYou have reached today's conversation limit."
  busy: "{prefix}&7The character is busy. Try again later."
  failed: "{prefix}&cNo reply: &f{error}"
  empty: "{prefix}&7Say a little more."
  reply: "{prefix}&f{character}&7: &f{reply}"
