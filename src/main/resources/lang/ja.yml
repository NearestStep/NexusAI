# NexusAI messages (Japanese)
prefix: "&8[&bNexusAI&8]&r "

command:
  no-permission: "{prefix}&c権限がありません。"
  unknown: "{prefix}&c不明なサブコマンドです。&e/nai help&c を使用してください。"
  extra-args: "{prefix}&c余分な引数があります。&e/nai help&c を使ってください。"
  help-header: "{prefix}&eNexusAI コマンド:"
  help-help: "&7/nai help &8- &fこのヘルプを表示"
  help-version: "&7/nai version &8- &fプラグインのバージョンを表示"
  help-reload: "&7/nai reload &8- &f設定、プロンプト、ロケールを再読込"
  help-status: "&7/nai status &8- &fステータスを表示"
  help-test: "&7/nai test [prompt] &8- &fテストリクエストを1回送る"
  help-prompts: "&7/nai prompts &8- &f名前付きプロンプトを表示"
  help-talk: "&7/nai talk <id> [message] &8- &fTalk to a character. No message opens a session."
  help-talk-end: "&7/nai talk end &8- &fEnd your dialogue session"
  test-sending: "{prefix}&7テストリクエストを送信しています..."
  test-ok: "{prefix}&a回答 &8({latency_ms} ms)&a: &f{answer}"
  test-fail: "{prefix}&cテスト失敗 &8({latency_ms} ms)&c: &f{error}"
  version: "{prefix}&fバージョン: &a{version}"
  prompts-header: "{prefix}&e名前付きプロンプト &8({count})&e:"
  prompts-line: "&7- &f{id}"
  prompts-empty: "{prefix}&7名前付きプロンプトはありません。&fprompts.yml&7 に追加してください。"
  reload-ok: "{prefix}&a設定を再読み込みしました。"
  reload-fail: "{prefix}&c再読み込みに失敗しました: &f{error}"
  status-header: "{prefix}&eステータス:"
  status-locale: "&7ロケール: &f{locale}"
  status-provider: "&7プロバイダー: &f{provider}"
  status-base-url: "&7Base URL: &f{base_url}"
  status-model: "&7モデル: &f{model}"
  status-api-key: "&7APIキー: &f{api_key}"
  status-pool: "&7プール: &f{pool_state} &8({pool_entries} 件)"
  status-cache: "&7キャッシュサイズ: &f{cache_size}"
  status-prompts: "&7名前付きプロンプト: &f{prompts}"
  status-papi: "&7PlaceholderAPI: &f{papi}"
  status-last-error: "&7最後のエラー: &f{last_error}"
  status-provider-pause: "&7プロバイダー一時停止: &f{provider_pause}"

common:
  "yes": "はい"
  "no": "いいえ"
  enabled: "有効"
  disabled: "無効"
  none: "なし"

error:
  rate-limit: "レート制限"
  quota: "クォータ"
  bad-key: "無効なAPIキー"
  unknown-model: "不明なモデル"
  timeout: "タイムアウト"
  other: "エラー"

# Dialogue keys below are English until translated.
talk:
  disabled: "{prefix}&cDialogues are disabled."
  players-only: "{prefix}&cOnly players can talk to a character. From the console: &e/nai talk <player> <id>"
  usage: "{prefix}&cUsage: &e/nai talk <id> [message] &cor &e/nai talk end"
  unknown-character: "{prefix}&cUnknown character &f{id}&c."
  unknown-player: "{prefix}&cPlayer &f{player} &cis not online."
  no-session: "{prefix}&7You are not in a dialogue."
  ended: "{prefix}&7Dialogue ended."
  started: "{prefix}&7You are talking to &f{id}&7. Type in chat. &e/nai talk end &7stops it."
  timeout: "{prefix}&7The conversation ended."
  left: "{prefix}&7You walked away."
  cooldown: "{prefix}&7Wait a moment."
  too-long: "{prefix}&cThat message is too long. Max &f{max}&c characters."
  replies: "{prefix}&7This conversation is over."
  daily: "{prefix}&cYou have reached today's conversation limit."
  busy: "{prefix}&7The character is busy. Try again later."
  failed: "{prefix}&cNo reply: &f{error}"
  empty: "{prefix}&7Say a little more."
  reply: "{prefix}&f{character}&7: &f{reply}"
