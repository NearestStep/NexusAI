# NexusAI messages (Italian)
prefix: "&8[&bNexusAI&8]&r "

command:
  no-permission: "{prefix}&cPermesso negato."
  unknown: "{prefix}&cSottocomando sconosciuto. Usa &e/nai help&c."
  extra-args: "{prefix}&cArgomenti di troppo. Usa &e/nai help&c."
  help-header: "{prefix}&eComandi NexusAI:"
  help-help: "&7/nai help &8- &fMostra questo aiuto"
  help-version: "&7/nai version &8- &fMostra la versione del plugin"
  help-reload: "&7/nai reload &8- &fRicarica config, prompt e locale"
  help-status: "&7/nai status &8- &fMostra lo stato"
  help-test: "&7/nai test [prompt] &8- &fInvia una richiesta di prova"
  help-prompts: "&7/nai prompts &8- &fElenca i prompt con nome"
  help-talk: "&7/nai talk <id> [message] &8- &fTalk to a character. No message opens a session."
  help-talk-end: "&7/nai talk end &8- &fEnd your dialogue session"
  test-sending: "{prefix}&7Invio di una richiesta di prova..."
  test-ok: "{prefix}&aRisposta &8({latency_ms} ms)&a: &f{answer}"
  test-fail: "{prefix}&cTest non riuscito &8({latency_ms} ms)&c: &f{error}"
  version: "{prefix}&fVersione: &a{version}"
  prompts-header: "{prefix}&ePrompt con nome &8({count})&e:"
  prompts-line: "&7- &f{id}"
  prompts-empty: "{prefix}&7Nessun prompt con nome. Aggiungili in &fprompts.yml&7."
  reload-ok: "{prefix}&aConfigurazione ricaricata."
  reload-fail: "{prefix}&cRicarica non riuscita: &f{error}"
  status-header: "{prefix}&eStato:"
  status-locale: "&7Locale: &f{locale}"
  status-provider: "&7Provider: &f{provider}"
  status-base-url: "&7Base URL: &f{base_url}"
  status-model: "&7Modello: &f{model}"
  status-api-key: "&7Chiave API: &f{api_key}"
  status-pool: "&7Pool: &f{pool_state} &8({pool_entries} voci)"
  status-cache: "&7Dimensione cache: &f{cache_size}"
  status-prompts: "&7Prompt con nome: &f{prompts}"
  status-papi: "&7PlaceholderAPI: &f{papi}"
  status-last-error: "&7Ultimo errore: &f{last_error}"
  status-provider-pause: "&7Pausa del provider: &f{provider_pause}"

common:
  "yes": "sì"
  "no": "no"
  enabled: "attivo"
  disabled: "disattivo"
  none: "nessuno"

error:
  rate-limit: "limite di richieste"
  quota: "quota"
  bad-key: "chiave API non valida"
  unknown-model: "modello sconosciuto"
  timeout: "timeout"
  other: "errore"

# Dialogue keys below are English until translated.
talk:
  disabled: "{prefix}&cDialogues are disabled."
  players-only: "{prefix}&cOnly players can talk to a character. From the console: &e/nai talk <player> <id>"
  usage: "{prefix}&cUsage: &e/nai talk <id> [message] &cor &e/nai talk end"
  unknown-character: "{prefix}&cUnknown character &f{id}&c."
  unknown-player: "{prefix}&cPlayer &f{player} &cis not online."
  no-session: "{prefix}&7You are not in a dialogue."
  ended: "{prefix}&7Dialogue ended."
  started: "{prefix}&7You are talking to &f{id}&7. Type in chat. &e/nai talk end &7stops it."
  timeout: "{prefix}&7The conversation ended."
  left: "{prefix}&7You walked away."
  cooldown: "{prefix}&7Wait a moment."
  too-long: "{prefix}&cThat message is too long. Max &f{max}&c characters."
  replies: "{prefix}&7This conversation is over."
  daily: "{prefix}&cYou have reached today's conversation limit."
  busy: "{prefix}&7The character is busy. Try again later."
  failed: "{prefix}&cNo reply: &f{error}"
  empty: "{prefix}&7Say a little more."
  reply: "{prefix}&f{character}&7: &f{reply}"
