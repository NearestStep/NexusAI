# NexusAI messages (Turkish)
prefix: "&8[&bNexusAI&8]&r "

command:
  no-permission: "{prefix}&cYetkiniz yok."
  unknown: "{prefix}&cBilinmeyen alt komut. &e/nai help&c kullanın."
  extra-args: "{prefix}&cFazla argüman. &e/nai help&c kullanın."
  help-header: "{prefix}&eNexusAI komutları:"
  help-help: "&7/nai help &8- &fBu yardımı göster"
  help-version: "&7/nai version &8- &fEklenti sürümünü göster"
  help-reload: "&7/nai reload &8- &fConfig, istemler ve locale'i yenile"
  help-status: "&7/nai status &8- &fDurumu göster"
  help-test: "&7/nai test [prompt] &8- &fBir test isteği gönder"
  help-prompts: "&7/nai prompts &8- &fAdlandırılmış istemleri listele"
  help-talk: "&7/nai talk <id> [message] &8- &fTalk to a character. No message opens a session."
  help-talk-end: "&7/nai talk end &8- &fEnd your dialogue session"
  test-sending: "{prefix}&7Test isteği gönderiliyor..."
  test-ok: "{prefix}&aYanıt &8({latency_ms} ms)&a: &f{answer}"
  test-fail: "{prefix}&cTest başarısız &8({latency_ms} ms)&c: &f{error}"
  version: "{prefix}&fSürüm: &a{version}"
  prompts-header: "{prefix}&eAdlandırılmış istemler &8({count})&e:"
  prompts-line: "&7- &f{id}"
  prompts-empty: "{prefix}&7Adlandırılmış istem yok. &fprompts.yml&7 dosyasına ekleyin."
  reload-ok: "{prefix}&aYapılandırma yenilendi."
  reload-fail: "{prefix}&cYenileme başarısız: &f{error}"
  status-header: "{prefix}&eDurum:"
  status-locale: "&7Locale: &f{locale}"
  status-provider: "&7Sağlayıcı: &f{provider}"
  status-base-url: "&7Base URL: &f{base_url}"
  status-model: "&7Model: &f{model}"
  status-api-key: "&7API anahtarı: &f{api_key}"
  status-pool: "&7Havuz: &f{pool_state} &8({pool_entries} kayıt)"
  status-cache: "&7Önbellek boyutu: &f{cache_size}"
  status-prompts: "&7Adlandırılmış istemler: &f{prompts}"
  status-papi: "&7PlaceholderAPI: &f{papi}"
  status-last-error: "&7Son hata: &f{last_error}"
  status-provider-pause: "&7Sağlayıcı duraklaması: &f{provider_pause}"

common:
  "yes": "evet"
  "no": "hayır"
  enabled: "açık"
  disabled: "kapalı"
  none: "yok"

error:
  rate-limit: "istek sınırı"
  quota: "kota"
  bad-key: "geçersiz API anahtarı"
  unknown-model: "bilinmeyen model"
  timeout: "zaman aşımı"
  other: "hata"

# Dialogue keys below are English until translated.
talk:
  disabled: "{prefix}&cDialogues are disabled."
  players-only: "{prefix}&cOnly players can talk to a character. From the console: &e/nai talk <player> <id>"
  usage: "{prefix}&cUsage: &e/nai talk <id> [message] &cor &e/nai talk end"
  unknown-character: "{prefix}&cUnknown character &f{id}&c."
  unknown-player: "{prefix}&cPlayer &f{player} &cis not online."
  no-session: "{prefix}&7You are not in a dialogue."
  ended: "{prefix}&7Dialogue ended."
  started: "{prefix}&7You are talking to &f{id}&7. Type in chat. &e/nai talk end &7stops it."
  timeout: "{prefix}&7The conversation ended."
  left: "{prefix}&7You walked away."
  cooldown: "{prefix}&7Wait a moment."
  too-long: "{prefix}&cThat message is too long. Max &f{max}&c characters."
  replies: "{prefix}&7This conversation is over."
  daily: "{prefix}&cYou have reached today's conversation limit."
  busy: "{prefix}&7The character is busy. Try again later."
  failed: "{prefix}&cNo reply: &f{error}"
  empty: "{prefix}&7Say a little more."
  reply: "{prefix}&f{character}&7: &f{reply}"
