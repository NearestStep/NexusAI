# Named prompts for NexusAI.
config-version: 1
#
# Placeholders:
#   %ainexus_cached_<id>%     shared TTL cache (holograms, TAB, scoreboards)
#   %ainexus_generate_<id>%   one unique answer from the pool
#
# If <id> is not defined in this file, the placeholder text is sent to the model as-is.
# That keeps existing literal prompts working.
#
# An id matches [a-z0-9_-]. A plugin may also register namespace:id from code.
# Quote that id here when overriding it: "quests:intro":
# The prompt text may be a string, a block scalar, or a list of lines.
# A list is joined with newlines, so line breaks stay in the prompt.
#
# {token} in the prompt is filled from vars before the request. A var value may contain
# PlaceholderAPI placeholders; those are resolved for the player who is looking.
# The cache and the pool are keyed by that resolved text, so one player's values are never
# reused for someone else. A prompt with no player-specific vars stays shared.
#
# These tokens work without PlaceholderAPI. They are read on the player's region thread.
# A vars: entry of the same name wins: {player} {world} {biome} {time} {weather}
# {time} is morning, day, evening, or night. {weather} is clear, rain, or thunder.
#
# format: simple, chat, gui, name, hologram, actionbar, or bossbar.
# Omit it to use formats.default from config.yml. The format is part of the cache key
# and, except for the default simple format, part of the pool key.
#
# Optional keys inherit config.yml when omitted:
#   ttl                 seconds for %ainexus_cached_<id>% and prewarm
#   fallback            text while this prompt has no answer
#   max-prompt-length   cap on the resolved text. Omit it and limits.max-prompt-length
#                       does not apply to text stored in this file.
#   model, system-prompt, temperature, max-tokens
#                       same meaning as the api section / a pool entry override.
#                       0 or a negative max-tokens omits the field. A higher value is sent
#                       for that prompt, including /nai talk.
#   fallback-model      provider and model tried once after the model queue fails for this call.
#                       Omit it to use fallback-model from config.yml.
#   knowledge           file names from plugins/NexusAI/knowledge without .md or .txt
#   context             provider ids, or all. Omitted prompts keep the 1.0.x text and cache key.
#                       Ignored for pool.entries, prewarm, and generate_.
#
# Answer order: model-queue, then fallback-model, then a pooled answer, then fallback text.
#
# pool.entries[].prompt and prewarm.prompts may use an id.
# /nai reload reads this file again. It does not drop prompts a plugin registered from code.
# /nai prompts lists the ids in this file, then one line of those registered prompts.
# /nai test <id> sends that prompt, including a registered namespace:id.

# survival_tips:
#   prompt: |
#     Give one short Minecraft survival tip.
#     One sentence, no markdown.
#   ttl: 600
#   fallback: "..."
