# sign_name:
#   prompt: "A short shop name for {player}"
#   format: name
#
# Character for /nai talk. dialogue: and actions: are optional.
# The prompt text is the character. Player chat is wrapped as player input and is not the prompt.
# Actions are fixed commands. The model only chooses the name. {player} and {uuid} are filled here.
# as: player (default) or console. Console runs as the server, so keep the command fixed and limited.
