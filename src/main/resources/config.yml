# NexusAI configuration
#
# Prefer setting the API key via environment variable NEXUSAI_API_KEY.
# Do not commit real keys. api.key below is only a fallback for local testing.
#
# Long prompts belong in prompts.yml under a short id, for example survival_tips:
#   %ainexus_cached_survival_tips%
#   %ainexus_generate_survival_tips%
# Text that is not an id is still sent to the model exactly as written.
#
# config-version is the schema. NexusAI migrates older files (including 0.6.0 files
# that have no version) and writes <file>.bak before it changes anything.

config-version: 1

# Player-facing command language (lang/<locale>.yml). Missing keys fall back to en.
locale: en

api:
  # openai | groq | cerebras | gemini | deepseek | ollama | openrouter
  provider: openai
  model: gpt-4o-mini
  # Empty = default base-url for the selected provider.
  # Ollama works without a key (Authorization is omitted). Any localhost / port 11434 base-url does too.
  base-url: ""
  # Legacy single key. Prefer providers.<id>.api-key. NEXUSAI_API_KEY still overrides a single literal key.
  # Leave empty and use NEXUSAI_API_KEY instead. Empty is valid for local endpoints.
  key: ""
  # Empty = do not send a system message
  system-prompt: ""
  # Negative = do not send temperature. 0 is a real value.
  temperature: -1
  # 0 = do not send max_tokens. Reasoning models are raised to at least 2048.
  max-tokens: 0
  # Strip markdown and clamp the answer (0 = no limit). Useful for holograms and menus.
  strip-markdown: false
  max-answer-chars: 0
  max-answer-lines: 0
  # Sent only for reasoning models (o1/o3/o4, gpt-oss, deepseek-r1, qwq, *reasoner*). off = never send.
  reasoning-effort: low
  connect-timeout: 5
  read-timeout: 30

# Endpoints and keys. type is openai-compatible or gemini.
# api-key is one string or a list (round-robin). A key that returns 401 or 429 is skipped for a while.
# ${ENV_VAR} is replaced in url and api-key. Empty string "" or empty list [].
# Keys are masked to the last 4 characters in status and logs.
providers:
  openai:
    type: openai-compatible
    url: "https://api.openai.com/v1"
    api-key: ""
    # api-key:
    #   - "${OPENAI_KEY_A}"
    #   - "${OPENAI_KEY_B}"
  groq:
    type: openai-compatible
    url: "https://api.groq.com/openai/v1"
    api-key: ""
  cerebras:
    type: openai-compatible
    url: "https://api.cerebras.ai/v1"
    api-key: ""
  gemini:
    type: gemini
    url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api-key: ""
  deepseek:
    type: openai-compatible
    url: "https://api.deepseek.com"
    api-key: ""
  ollama:
    type: openai-compatible
    url: "http://localhost:11434/v1"
    api-key: ""
  openrouter:
    type: openai-compatible
    url: "https://openrouter.ai/api/v1"
    api-key: ""

# Switch to the next entry when remaining header budget hits the threshold, the daily cap is reached,
# the provider returns 429, or the call errors or times out. A prompt's model: override still wins.
# 0 threshold means "remaining is zero".
model-queue-remaining-threshold: 0
model-queue:
  - provider: openai
    model: gpt-4o-mini
    # daily-request-limit: 1000
  # - provider: groq
  #   model: llama-3.3-70b-versatile
  #   daily-request-limit: 500

# format: presets. Prompts inherit formats.default when they omit format.
formats:
  default: simple
  simple:
    instruction: ""
    max-lines: 0
    max-chars: 0
    max-chars-per-line: 0
    max-words: 0
    max-sentences: 0
    strip-markdown: false
    strip-trailing-punctuation: false
  chat:
    instruction: "Reply in 1 to 3 sentences. Do not use markdown."
    max-lines: 0
    max-chars: 0
    max-chars-per-line: 0
    max-words: 0
    max-sentences: 3
    strip-markdown: true
    strip-trailing-punctuation: false
  gui:
    instruction: "Use at most 6 lines. Do not use markdown."
    max-lines: 6
    max-chars: 0
    max-chars-per-line: 0
    max-words: 0
    max-sentences: 0
    strip-markdown: true
    strip-trailing-punctuation: false
  name:
    instruction: "Reply with 1 to 4 words and no trailing punctuation."
    max-lines: 1
    max-chars: 0
    max-chars-per-line: 0
    max-words: 4
    max-sentences: 0
    strip-markdown: true
    strip-trailing-punctuation: true
  hologram:
    instruction: "Use at most 4 lines. Each line must be at most 40 characters. Separate lines with a newline."
    max-lines: 4
    max-chars: 0
    max-chars-per-line: 40
    max-words: 0
    max-sentences: 0
    strip-markdown: true
    strip-trailing-punctuation: false
  actionbar:
    instruction: "Reply with one sentence of at most 60 characters."
    max-lines: 1
    max-chars: 60
    max-chars-per-line: 0
    max-words: 0
    max-sentences: 1
    strip-markdown: true
    strip-trailing-punctuation: false
  bossbar:
    instruction: "Reply with one line of at most 80 characters."
    max-lines: 1
    max-chars: 80
    max-chars-per-line: 0
    max-words: 0
    max-sentences: 0
    strip-markdown: true
    strip-trailing-punctuation: false

cache:
  # Seconds
  ttl: 300
  max-size: 1000

limits:
  # Server-wide caps. Console commands, the pool, and prewarm spend only these.
  requests-per-minute: 30
  requests-per-day: 1000
  # A player also spends a personal cap, so one player cannot use the whole server budget.
  player-requests-per-minute: 10
  player-requests-per-day: 200
  max-prompt-length: 128
  # After HTTP 429, pause every request to this provider (seconds).
  # A numeric Retry-After header cannot make this shorter; a larger value is used instead.
  provider-pause-seconds: 60
  # After HTTP 401 or 402, pause for longer (seconds).
  auth-pause-seconds: 300
  # Per-prompt backoff after any provider error. Doubles until the max.
  error-backoff-initial-seconds: 2
  error-backoff-max-seconds: 120
  # How often the same error kind is written to the server log.
  error-log-cooldown-seconds: 30

# Unique-answer pools for %ainexus_generate_<prompt>%
pool:
  enabled: true
  max-total-prompts: 10
  # Save answers to pool.yml so a restart does not buy the pool again.
  persist: true
  save-delay-seconds: 2
  entries: []
  # Example (prompt may be literal text or an id from prompts.yml):
  # entries:
  #   - prompt: survival_tips
  #     size: 3
  #     min-threshold: 1
  #   - prompt: "Short warm welcome for the joining player"
  #     size: 3
  #     min-threshold: 1
  #     # Optional overrides of api.system-prompt / temperature / max-tokens
  #     # temperature: 0.2
  #     # max-tokens: 64
  #     # Model leaves {player_name} in the answer; NexusAI substitutes via PlaceholderAPI on delivery
  #     vars:
  #       player_name: "%player_name%"
  #   - prompt: "One short tip for miners"
  #     size: 3
  #     min-threshold: 1

# TTL cache warm-up for %ainexus_cached_<prompt>%
prewarm:
  enabled: true
  # Seconds between freshness checks (refresh when not isFresh / ~80% TTL)
  refresh-before-ttl: 60
  prompts: []
  # Example (a line may be literal text, "{player}", or an id from prompts.yml):
  # prompts:
  #   - survival_tips
  #   - "Welcome, {player}"
  #   - "Server tip of the day"

fallback: "..."
