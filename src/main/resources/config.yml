# NexusAI configuration
#
# Prefer setting the API key via environment variable NEXUSAI_API_KEY.
# Do not commit real keys. api.key below is only a fallback for local testing.
#
# Long prompts belong in prompts.yml under a short id, for example survival_tips:
#   %ainexus_cached_survival_tips%
#   %ainexus_generate_survival_tips%
# Text that is not an id is still sent to the model exactly as written.
#
# config-version is the schema. NexusAI migrates older files (including 0.6.0 files
# that have no version) and writes <file>.bak before it changes anything.
# Version 2 replaces a leftover api.max-tokens of 0 (the 0.6.0 and 0.7.0 default)
# with 256 once. After that, a 0 you set is kept. The log says you can set it back.
# Appending missing default keys does the same, but one startup writes only one backup
# of config.yml even when migration and missing keys both change it.
# When that backup already exists, the copy is config.yml.bak.<timestamp>.
# The backup path is written to the server log.

config-version: 2

# Player-facing command language (lang/<locale>.yml). Missing keys fall back to en.
locale: en

api:
  # openai | groq | cerebras | gemini | deepseek | ollama | openrouter
  provider: openai
  model: gpt-4o-mini
  # Empty = default base-url for the selected provider.
  # Ollama works without a key (Authorization is omitted). Any localhost / port 11434 base-url does too.
  base-url: ""
  # Legacy single key. Prefer providers.<id>.api-key. NEXUSAI_API_KEY still overrides a single literal key.
  # Leave empty and use NEXUSAI_API_KEY instead. Empty is valid for local endpoints.
  key: ""
  # Empty = do not send a system message
  system-prompt: ""
  # Negative = do not send temperature. 0 is a real value.
  temperature: -1
  # 0 or a negative value (for example -1) does not send max_tokens.
  # 256 fits a short placeholder or talk reply. A prompt or pool entry may set a higher max-tokens.
  # A config-version 1 file that still has the old default 0 is migrated to 256 once.
  # Groq in the model queue logs one warning when this value is not positive.
  # Reasoning models are raised to at least 2048. o-series models receive max_completion_tokens instead.
  max-tokens: 256
  # Strip markdown and clamp the answer (0 = no limit). Useful for holograms and menus.
  strip-markdown: false
  max-answer-chars: 0
  max-answer-lines: 0
  # Sent only for reasoning models (o1/o3/o4, gpt-oss, deepseek-r1, qwq, *reasoner*). off = never send.
  reasoning-effort: low
  connect-timeout: 5
  read-timeout: 30

# Endpoints and keys. type is openai-compatible or gemini.
# api-key is one string or a list (round-robin). A key that returns 401 or 429 is skipped for a while.
# ${ENV_VAR} and ${ENV:VAR} are replaced in url and api-key. An unset variable becomes empty.
# Its name is logged. The value is not. Empty string "" or empty list [].
# Optional api-key-file reads one raw key per line (UTF-8). A relative path is under this folder.
#   api-key-file: secrets/groq.key
# A non-empty api-key-file replaces api-key for that provider. Do not put a key in url.
# Keys are masked to the last 4 characters in status and logs. A file source is marked (file).
providers:
  openai:
    type: openai-compatible
    url: "https://api.openai.com/v1"
    api-key: ""
    # api-key:
    #   - "${OPENAI_KEY_A}"
    #   - "${OPENAI_KEY_B}"
  groq:
    type: openai-compatible
    url: "https://api.groq.com/openai/v1"
    api-key: ""
  cerebras:
    type: openai-compatible
    url: "https://api.cerebras.ai/v1"
    api-key: ""
  gemini:
    type: gemini
    url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api-key: ""
  deepseek:
    type: openai-compatible
    url: "https://api.deepseek.com"
    api-key: ""
  ollama:
    type: openai-compatible
    url: "http://localhost:11434/v1"
    api-key: ""
  openrouter:
    type: openai-compatible
    url: "https://openrouter.ai/api/v1"
    api-key: ""

# failover (default): every request starts at the first available row. The next row is used only
# after a failure, a cooldown, a daily cap, or remaining budget at or below the threshold.
# round-robin: each new request starts at the next available row, then walks the circle the same way.
# Rows on cooldown, at daily-request-limit, or at or below the threshold are skipped.
# Unknown values are treated as failover and logged once per startup and /nai reload.
model-queue-strategy: failover
# Switch to the next entry when remaining header budget hits the threshold, the daily cap is reached,
# the provider returns 429, or the call errors or times out. A prompt's model: override still wins.
# 0 threshold means "remaining is zero".
model-queue-remaining-threshold: 0
model-queue:
  - provider: openai
    model: gpt-4o-mini
    # daily-request-limit: 1000
  # - provider: groq
  #   model: llama-3.3-70b-versatile
  #   daily-request-limit: 500

# One last model after every model-queue entry is unavailable, failed, or rejected for this call.
# Order: model-queue, then fallback-model, then a pooled answer, then fallback text.
# Both provider and model are required. Leave either blank to disable.
# A queue row with the same provider and model keeps that row's daily cap and cooldown and is not called twice.
# A model that is not in the queue has its own cooldown. It is skipped when every queue row of that provider
# is already at its daily cap. The reply uses the same player-input filter as the queue.
# /nai status prints this model. A prompt may set its own fallback-model and that overrides this one.
fallback-model:
  provider: ""
  model: ""

# Server lore from plugins/NexusAI/knowledge/*.md and *.txt. No vector search.
# A prompt lists file names without the extension: knowledge: [lore, rules]
# The text is added to the system message after the admin system prompt and before the format instruction.
# When the request contains wrapped player input, the player-input guard stays last.
# max-chars is the cap for one request. max-file-chars is the cap for one file.
# Longer text is truncated and one warning is logged. /nai reload reads the folder again.
# The example file is created once and is never overwritten.
knowledge:
  max-chars: 6000
  max-file-chars: 4000

# format: presets. Prompts inherit formats.default when they omit format.
# A reply cut off by max_tokens keeps a sentence ending only past the halfway point.
# A period after a Roman numeral at the start of a line (I. through at most eight letters,
# optional indent, optional hashes such as "### II.") is a list or heading marker, not the
# end of the sentence. The same is true of any terminator on a markdown heading line.
# After the cut, a trailing heading that is only hashes, or hashes plus a bare marker
# ("###", "### I.", "### 3."), is dropped. A heading that already has title words stays.
formats:
  default: simple
  simple:
    instruction: ""
    max-lines: 0
    max-chars: 0
    max-chars-per-line: 0
    max-words: 0
    max-sentences: 0
    strip-markdown: false
    strip-trailing-punctuation: false
  chat:
    instruction: "Reply in 1 to 3 sentences. Do not use markdown."
    max-lines: 0
    max-chars: 0
    max-chars-per-line: 0
    max-words: 0
    max-sentences: 3
    strip-markdown: true
    strip-trailing-punctuation: false
  gui:
    instruction: "Use at most 6 lines. Do not use markdown."
    max-lines: 6
    max-chars: 0
    max-chars-per-line: 0
    max-words: 0
    max-sentences: 0
    strip-markdown: true
    strip-trailing-punctuation: false
  name:
    instruction: "Reply with 1 to 4 words and no trailing punctuation."
    max-lines: 1
    max-chars: 0
    max-chars-per-line: 0
    max-words: 4
    max-sentences: 0
    strip-markdown: true
    strip-trailing-punctuation: true
  hologram:
    instruction: "Use at most 4 lines. Each line must be at most 40 characters. Separate lines with a newline."
    max-lines: 4
    max-chars: 0
    max-chars-per-line: 40
    max-words: 0
    max-sentences: 0
    strip-markdown: true
    strip-trailing-punctuation: false
  actionbar:
    instruction: "Reply with one sentence of at most 60 characters."
    max-lines: 1
    max-chars: 60
    max-chars-per-line: 0
    max-words: 0
    max-sentences: 1
    strip-markdown: true
    strip-trailing-punctuation: false
  bossbar:
    instruction: "Reply with one line of at most 80 characters."
    max-lines: 1
    max-chars: 80
    max-chars-per-line: 0
    max-words: 0
    max-sentences: 0
    strip-markdown: true
    strip-trailing-punctuation: false

cache:
  # Seconds
  ttl: 300
  max-size: 1000
  # Length-trim notices are not this cache. Each prompt id is logged twice, then suppressed.
  # The notice key is that id (named prompt, pool entry, or talk character), not the template.
  # The line names a prompts.yml id or "nai talk", plus its length. A literal is not printed.
  # The notice map is an access-order LRU of 256 ids. /nai reload clears it.

limits:
  # Server-wide caps. Console commands, the pool, and prewarm spend only these.
  requests-per-minute: 30
  requests-per-day: 1000
  # A player also spends a personal cap, so one player cannot use the whole server budget.
  player-requests-per-minute: 10
  player-requests-per-day: 200
  max-prompt-length: 128
  # After HTTP 429, pause every request to this provider (seconds).
  # A numeric Retry-After header cannot make this shorter; a larger value is used instead.
  provider-pause-seconds: 60
  # After HTTP 401 or 402, pause for longer (seconds).
  auth-pause-seconds: 300
  # Per-prompt backoff after any provider error. Doubles until the max.
  error-backoff-initial-seconds: 2
  error-backoff-max-seconds: 120
  # How often the same error kind is written to the server log.
  error-log-cooldown-seconds: 30

# Outstanding HTTP calls. The four nexusai-http threads stay.
# max-in-flight is how many calls may be in progress. queue-size is how many more may wait
# for a slot. Anything beyond that fails at once with "HTTP queue is full".
# One connection error pauses that provider for limits.provider-pause-seconds (60).
# A weak endpoint (a local proxy, Ollama, a free-tier host) should use a lower max-in-flight.
# Both values must be greater than 0. 0 or a negative value is replaced with 64.
# Each bad key logs its own warning (the key, the rejected value, and 64).
http:
  max-in-flight: 64
  queue-size: 64

# Unique-answer pools for %ainexus_generate_<prompt>%
pool:
  enabled: true
  max-total-prompts: 10
  # Save answers to pool.yml so a restart does not buy the pool again.
  # The first save that strips markup from answers already on disk copies the file to
  # pool.yml.bak (or pool.yml.bak.<timestamp> when that backup exists), keeps the file mode,
  # and replaces the file with an atomic write. A later save of clean answers does not
  # write another backup.
  persist: true
  save-delay-seconds: 2
  entries: []
  # Example (prompt may be literal text or an id from prompts.yml):
  # entries:
  #   - prompt: survival_tips
  #     size: 3
  #     min-threshold: 1
  #   - prompt: "Short warm welcome for the joining player"
  #     size: 3
  #     min-threshold: 1
  #     # Optional overrides of api.system-prompt / temperature / max-tokens
  #     # temperature: 0.2
  #     # max-tokens: 64
  #     # Model leaves {player_name} in the answer; NexusAI substitutes via PlaceholderAPI on delivery
  #     vars:
  #       player_name: "%player_name%"
  #   - prompt: "One short tip for miners"
  #     size: 3
  #     min-threshold: 1

# TTL cache warm-up for %ainexus_cached_<prompt>%
prewarm:
  enabled: true
  # Seconds between freshness checks (refresh when not isFresh / ~80% TTL)
  refresh-before-ttl: 60
  prompts: []
  # Example (a line may be literal text, "{player}", or an id from prompts.yml):
  # prompts:
  #   - survival_tips
  #   - "Welcome, {player}"
  #   - "Server tip of the day"

# Opt-in chat moderation. Off by default.
# Public chat is still delivered immediately. The check runs afterwards and never
# cancels, delays, punishes, or runs a command. There is no command-on-flag.
# When this is enabled, the message text is sent to the provider below, or to the
# model-queue when provider and model are both empty. Use a local model (Ollama
# or LM Studio) if chat must not leave the machine.
# Each check spends the selected model-queue entry's daily-request-limit in usage.yml.
# The player-input guard is appended after system-prompt only when the request
# contains wrapped player input. Moderation wraps the chat line, so the guard is sent.
moderation:
  enabled: false
  # Both empty = first available model-queue entry. Set both to pin one endpoint.
  provider: ""
  model: ""
  # Server-wide cap. Further messages in that minute are not checked. Minimum 1.
  max-checks-per-minute: 30
  # Seconds before the same player is checked again. 0 = no cooldown.
  player-cooldown-seconds: 15
  # Trimmed messages shorter than this are ignored.
  min-length: 8
  system-prompt: |
    Classify the Minecraft chat message in the user turn.
    Reply with one JSON object and no other text:
    {"flagged":false,"category":"none","reason":""}
    Set flagged to true only for toxicity, insult, veiled insult, harassment, or spam.
    category must be one of: toxicity, insult, veiled insult, harassment, spam, none.
    reason is one short sentence when flagged, and empty otherwise.
  # 0 is sent. Negative = omit temperature.
  temperature: 0
  # 0 or a negative value omits max_tokens. A positive value is sent for the check only.
  max-tokens: 80

fallback: "..."

# NPC dialogues (/nai talk). Separate from placeholder limits.
# /nai talk needs nexusai.talk. That permission defaults to op; grant it to players explicitly.
# A reply still spends the model queue, key rotation, and the daily request caps.
# Dialogue lines are not stored in the answer pool. A generated greeting may be cached.
dialogue:
  enabled: true
  # Player and assistant lines kept for the model. 6 to 8 is the intended range.
  memory-turns: 8
  # Write plugins/NexusAI/dialogue-memory.yml. false keeps memory only until restart.
  persist-memory: false
  memory-max-chars: 8000
  # Drop a saved transcript after this many hours without a new line. 0 keeps it.
  memory-expiry-hours: 168
  # End a session after this many seconds without a player line. 0 disables the timer.
  session-timeout-seconds: 120
  # End a session when the player moves farther than this many blocks from where it started. 0 disables it.
  leave-radius: 8
  max-replies-per-session: 12
  message-cooldown-millis: 3000
  # 0 means no daily cap. A session counts as one conversation. Each one-shot line counts as one.
  conversations-per-player-per-day: 20
  max-message-length: 200
  # Cache a generated greeting. A greeting written under dialogue.greeting is not a model call.
  # The cache time is cache.ttl. Later lines in the same conversation are never cached.
  cache-greeting: true
  # Fold lines that fall out of memory-turns into one short summary. false keeps the 1.0.2 trim.
  # Each summary is its own model request. There is no per-character override.
  # Lines waiting to be folded are not written to disk. A restart before the call trims them.
  summary:
    enabled: false
    # Summarise once this many player turns have dropped out of memory-turns / memory-max-chars.
    threshold-turns: 2
    # Stored summary cap.
    max-chars: 400
    # Sent for the summary call only. 0 or a negative value omits max_tokens.
    max-tokens: 200
    # Both empty = model-queue. Both set = pin this provider/model (same rule as moderation).
    provider: ""
    model: ""

# Character actions. The model may pick a name through OpenAI tools. It cannot change the command.
# Placeholders never run these. A provider that rejects tools gets one retry with actions off.
actions:
  enabled: true
  # Append plugins/NexusAI/actions.log. The server log always gets one line too.
  log: true
  # How many actions from one model reply may run. The rest are refused and the character is told.
  max-per-reply: 1

# Context from other plugins (balance, rank, quest) for prompts that list context:.
# Providers never run on the main thread. A call that is still running at its timeout is
# interrupted, and the value is skipped. Providers should stop when the thread is interrupted.
context:
  enabled: true
  max-provider-timeout-millis: 200   # 10..1000; provider.timeout() is clamped to this
  total-timeout-millis: 300          # 10..2000
  max-chars-per-provider: 200        # 20..1000
  max-chars: 600                     # 50..4000, whole block before wrapping
  refresh-seconds: 30                # 1..3600, snapshot age for cached_ placeholders
  suspend-after-timeouts: 5          # 1..100
  suspend-seconds: 60                # 1..3600

# WARNING: allow-markup true lets MiniMessage click/hover tags, hex colours, and JSON click/hover components reach plugins that read NexusAI placeholders. A consumer can run a click such as run_command. Leave this false unless you accept that. Legacy § and & codes are always removed.
sanitize:
  allow-markup: false
