# Shared tip (cached_) and a pooled join line (generate_).
# Copy to plugins/NexusAI/config.yml. Missing keys are appended on startup.
# Set GROQ_API_KEY on the server process. Do not put the key in url.
config-version: 2
locale: en

api:
  provider: groq
  model: llama-3.3-70b-versatile
  base-url: ""
  key: ""
  max-tokens: 256
  temperature: -1

providers:
  groq:
    type: openai-compatible
    url: "https://api.groq.com/openai/v1"
    api-key: "${ENV:GROQ_API_KEY}"

model-queue-strategy: failover
model-queue-remaining-threshold: 0
model-queue:
  - provider: groq
    model: llama-3.3-70b-versatile
    daily-request-limit: 1000

fallback: "..."

cache:
  ttl: 300
  max-size: 1000

pool:
  enabled: true
  max-total-prompts: 10
  persist: true
  save-delay-seconds: 2
  entries:
    - prompt: join_welcome
      size: 3
      min-threshold: 1
      vars:
        player_name: "%player_name%"

prewarm:
  enabled: true
  refresh-before-ttl: 60
  prompts:
    - survival_tips
