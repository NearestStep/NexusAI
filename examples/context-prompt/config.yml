# Prompt that opts in to a context provider. Not listed in pool or prewarm.
# Copy to plugins/NexusAI/config.yml. Set GROQ_API_KEY on the server process.
config-version: 2
locale: en

api:
  provider: groq
  model: llama-3.3-70b-versatile
  base-url: ""
  key: ""
  max-tokens: 256
  temperature: -1

providers:
  groq:
    type: openai-compatible
    url: "https://api.groq.com/openai/v1"
    api-key: "${ENV:GROQ_API_KEY}"

model-queue-strategy: failover
model-queue-remaining-threshold: 0
model-queue:
  - provider: groq
    model: llama-3.3-70b-versatile
    daily-request-limit: 1000

fallback: "..."

context:
  enabled: true
  max-provider-timeout-millis: 200
  total-timeout-millis: 300
  max-chars-per-provider: 200
  max-chars: 600
  refresh-seconds: 30
  suspend-after-timeouts: 5
  suspend-seconds: 60

pool:
  enabled: true
  max-total-prompts: 10
  persist: true
  save-delay-seconds: 2
  entries: []

prewarm:
  enabled: false
  refresh-before-ttl: 60
  prompts: []
