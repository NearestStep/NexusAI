# Three providers, one queue, round-robin.
# Copy to plugins/NexusAI/config.yml.
# Set GROQ_API_KEY, GEMINI_API_KEY, and DEEPSEEK_API_KEY on the server process.
config-version: 2
locale: en

api:
  provider: groq
  model: llama-3.3-70b-versatile
  base-url: ""
  key: ""
  max-tokens: 256
  temperature: -1

providers:
  groq:
    type: openai-compatible
    url: "https://api.groq.com/openai/v1"
    api-key: "${ENV:GROQ_API_KEY}"
  gemini:
    type: gemini
    url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api-key: "${ENV:GEMINI_API_KEY}"
  deepseek:
    type: openai-compatible
    url: "https://api.deepseek.com"
    api-key: "${ENV:DEEPSEEK_API_KEY}"

model-queue-strategy: round-robin
model-queue-remaining-threshold: 0
model-queue:
  - provider: groq
    model: llama-3.3-70b-versatile
    daily-request-limit: 1000
  - provider: gemini
    model: gemini-2.0-flash
    daily-request-limit: 1000
  - provider: deepseek
    model: deepseek-chat
    daily-request-limit: 1000

fallback-model:
  provider: ""
  model: ""

fallback: "..."

pool:
  enabled: false
  max-total-prompts: 10
  persist: true
  save-delay-seconds: 2
  entries: []

prewarm:
  enabled: false
  refresh-before-ttl: 60
  prompts: []
